# Full-duplex voice runtime configuration for the English example.
#
# Providers: "together" (Nemotron streaming ASR), "qwen" (DashScope realtime
# TTS), "cartesia" (streaming STT/TTS), "inject" (dev text injection),
# "mock" (offline fakes).
# API keys are resolved from the environment, never from this file.

version: 1

session:
  control_tick_ms: 40

audio:
  input_sample_rate_hz: 16000
  output_sample_rate_hz: 24000
  frame_ms: 20

asr:
  # `inject` is the keyless default: a silent recognizer plus the browser text
  # box. Switch to `together` once TOGETHER_API_KEY is set.
  provider: inject
  model: nvidia/nemotron-3.5-asr-streaming-0.6b
  endpoint: wss://api.together.ai/v1/realtime
  api_key_env: TOGETHER_API_KEY
  chunk_ms: 160
  manual_commit: false
  # With manual_commit, audio keeps flowing this long after local speech ends before the commit; a recognizer finalized too soon after a short word can return nothing.
  commit_delay_ms: 300
  # With manual_commit, a commit is sent every this much silence so the recognizer never holds a long silence; 0 disables.
  idle_commit_ms: 2000
  # No default; network ASR providers refuse to start without it.
  locale: en-US
  # Bounded safety limits for the duplex recognizer connection.
  open_timeout_ms: 10000
  write_timeout_ms: 2000
  input_buffer_ms: 1000
  # Used only by the Cartesia STT factory; select its full sample for live input.
  cartesia:
    api_version: "2026-08-14"
    finalize_timeout_ms: 2000
    finish_timeout_ms: 5000
    max_transcript_bytes: 65536
  partials:
    enabled: true
    stable_after_ms: 320
    stable_revisions: 2

tts:
  provider: mock
  model: qwen3-tts-flash
  endpoint: wss://dashscope.aliyuncs.com/api/v1/inference/qwen3-tts/realtime
  api_key_env: DASHSCOPE_API_KEY
  # Leave blank: the voice id is read from `voice_env` so it stays out of the
  # committed config.
  voice: ""
  voice_env: QWEN_VOICE_ID
  sample_rate_hz: 24000
  chunk_ms: 60
  # Language sent with synthesis and premade warmup requests, and the reply language given to the task agent.
  # No default; network TTS providers refuse to start without it.
  language: English
  # Bounded safety limits for one synthesis response.
  open_timeout_ms: 10000
  request_timeout_ms: 30000
  max_input_bytes: 65536
  # Used only by the Cartesia TTS factory; the keyless mock default is unchanged.
  cartesia:
    api_version: "2026-08-14"
    max_buffer_delay_ms: 0
  premade:
    enabled: true
    phrases:
      - "Okay."
      - "Okay, got it."

turn_control:
  slot_fallback: neutral
  soft_silence_ms: 500
  hard_silence_ms: 1100
  require_semantic_completion: true
  barge_in:
    duck_immediately: true
    duck_gain: 0.15
    duck_fade_ms: 60
    confirm_ms: 240
  backchannel:
    enabled: true
    minimum_interval_ms: 2500
    maximum_per_user_turn: 2

agents:
  interaction:
    enabled: true
    spec: ../../agents/voice-interaction.yaml
    minimum_interval_ms: 250
    # Hosted models took 1.1-1.6 s per assessment in a live check; 900 ms timed out every time.
    # Overlap waits up to twice this before aborting.
    timeout_ms: 1500
  task:
    spec: ../../agents/reservation.yaml
    timeout_ms: 30000
  deep:
    enabled: false
    # A dedicated spec: the task agent's spec requires per-turn voice context,
    # which deep work does not have.
    spec: ../../agents/deep-worker.yaml
    timeout_ms: 60000
  speculative:
    enabled: false
    spec: ../../agents/reservation-readonly.yaml
    allowed_tools:
      - search_availability
    minimum_intent_confidence: 0.85
    maximum_parallel_tasks: 1
    timeout_ms: 5000
    allow_pure_read: true

speech:
  # Reply of the keyless mock task agent.
  # This and the other spoken texts below are in the sample's session language (tts.language); the task agent writes its own replies in that language.
  mock_reply: "Tell me the date, time, and party size for the reservation."
  backchannel_text: "Mm-hm."
  failure_text: "Sorry, I couldn't prepare a reply. Please say that again."
  # Outcomes a reply may name.
  # The model writes the words; the runtime checks the named outcome against the tools executed in that turn.
  outcomes:
    availability_checked:
      operation: search_availability
      class: factual
      receipt_fields: {status: searched}
      bindings: [date, time, party_size]
    reserved:
      operation: reserve_restaurant
      class: transactional
      receipt_fields: {status: committed}
      bindings: [restaurant_id, date, time, party_size, customer_name, window_seat_requested]
      argument_defaults: {window_seat_requested: false}
  hard_stop_ack_text: "Okay, I stopped."
  # Speech state only advances on a client playback ACK; this releases the
  # queue if a client disconnects mid-utterance.
  playback_ack_timeout_ms: 15000
  # After an Abort, the interrupted acknowledgement is awaited for this long
  # before the speech settles with its already confirmed progress.
  playback_stop_ack_timeout_ms: 1000
  # Recent clauses kept for self-echo detection and the session summary.
  # Durable history lives in the agent's memory, rewritten to what was heard.
  audible_history_max_clauses: 64
  progress_templates:
    search_availability:
      text: "Checking for places that match."
      minimum_expected_latency_ms: 1200
      expire_after_ms: 4000

tools:
  effects:
    search_availability: pure_read
    reserve_restaurant: transactional_write

vad:
  onset_frames: 3
  offset_frames: 12
  onset_ratio: 4.0
  offset_ratio: 2.0

echo:
  enabled: true
  similarity_threshold: 0.82
  min_chars: 4

observability:
  event_log: true
  event_log_dir: target/voice-traces
  include_sensitive_payloads: false

dev:
  allow_text_injection: true