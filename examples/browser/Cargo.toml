[package]
name = "browser-example"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Browser example for voice-live: an axum WebSocket gateway, a web client, and a demo reservation backend"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "browser-example"
path = "src/main.rs"

[dependencies]
voice-live = { path = "../.." }
ai-agents = { version = "1.0.11", default-features = false }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
# MockLLMProvider, to run agent specs through the real runtime without a key.
ai-agents-llm = "1.0.11"
bytes = "1"
tokio-tungstenite = "0.26"
