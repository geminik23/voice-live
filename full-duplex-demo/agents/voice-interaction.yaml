name: DuplexInteractionController
version: "0.1.0"
description: Interpret user speech in context without choosing runtime actions.

system_prompt: |
  Interpret the current user speech in the context provided by the runtime.
  Distinguish a response to a question from a backchannel during an explanation.
  Identify whether the thought is complete, whether the user asks to stop, and any corrections, intent, or slot values.
  Use only the assistant text reported as heard. If the meaning is unclear, return uncertain.
  Do not answer the task, call tools, or choose playback actions.

llms:
  default:
    provider: openai
    model: gpt-4.1-nano
    api_key_env: OPENAI_API_KEY

llm:
  default: default

memory:
  type: in-memory
  max_messages: 4