[package]
name = "full-duplex-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "full-duplex-demo"
path = "src/main.rs"

[dependencies]
voice-live = { path = ".." }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
# MockLLMProvider, to run agent specs through the real runtime without a key.
ai-agents-llm = "1.0.10"
serde_yaml = "0.9"
ai-agents = { version = "1.0.10", default-features = false }
bytes = "1"
tokio-tungstenite = "0.26"
