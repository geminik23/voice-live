# Streaming Cartesia Ink Whisper STT and Sonic TTS with the reservation task agent.
# Requires CARTESIA_API_KEY, CARTESIA_VOICE_ID, and OPENAI_API_KEY.
# Microphone audio and conversation text leave the host and may incur charges.
# Verify the ignored provider contracts before relying on live model/voice/flush behavior.
version: 1

audio:
  input_sample_rate_hz: 16000
  output_sample_rate_hz: 24000
  frame_ms: 20

asr:
  provider: cartesia
  endpoint: wss://api.cartesia.ai/stt/websocket
  model: ink-whisper
  api_key_env: CARTESIA_API_KEY
  chunk_ms: 100
  manual_commit: true
  locale: ko-KR
  open_timeout_ms: 10000
  write_timeout_ms: 2000
  input_buffer_ms: 1000
  cartesia:
    api_version: "2026-08-14"
    finalize_timeout_ms: 2000
    finish_timeout_ms: 5000
    max_transcript_bytes: 65536

tts:
  provider: cartesia
  endpoint: wss://api.cartesia.ai/tts/websocket
  model: sonic-3.6
  api_key_env: CARTESIA_API_KEY
  voice: ""
  voice_env: CARTESIA_VOICE_ID
  language: ko
  sample_rate_hz: 24000
  open_timeout_ms: 10000
  request_timeout_ms: 30000
  max_input_bytes: 65536
  cartesia:
    api_version: "2026-08-14"
    max_buffer_delay_ms: 0
  premade:
    enabled: false

turn_control:
  slot_fallback: neutral

speech:
  mode: strict
  mock_response: collect_details
  hard_stop_ack_text: "네, 멈췄어요."
  backchannel_text: "네"
  failure_text: "죄송합니다. 응답을 준비하지 못했어요. 다시 말씀해 주세요."
  responses:
    collect_details: {kind: prompt, text: "예약할 날짜와 시간, 인원을 알려 주세요.", question: free_text}
    choose_option: {kind: prompt, text: "원하는 식당을 알려 주세요.", question: free_text}
    confirm_details: {kind: prompt, text: "말씀하신 조건으로 예약을 진행할까요?", question: yes_no}
    availability_checked:
      kind: tool_outcome
      text: "예약 가능 여부 조회를 마쳤습니다."
      operation: search_availability
      class: factual
      receipt_fields: {status: searched}
      bindings: [date, time, party_size]
    reserved:
      kind: tool_outcome
      text: "요청하신 예약이 완료되었습니다."
      operation: reserve_restaurant
      class: transactional
      receipt_fields: {status: committed}
      bindings: [restaurant_id, date, time, party_size, customer_name, window_seat_requested]
      argument_defaults: {window_seat_requested: false}

agents:
  interaction:
    enabled: true
    spec: ../agents/voice-interaction.yaml
  task:
    spec: ../agents/reservation.yaml
    timeout_ms: 30000

observability:
  event_log: true
  event_log_dir: target/voice-traces
  include_sensitive_payloads: false

dev:
  allow_text_injection: true
