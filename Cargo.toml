[package]
name = "voice-live"
version = "0.1.0"
edition = "2024"
description = "Full-duplex voice interaction runtime"
license = "Apache-2.0"

[workspace]
members = ["full-duplex-demo"]

[features]
default = ["framework"]
framework = ["dep:ai-agents"]

[dependencies]
ai-agents = { version = "1.0.11", default-features = false, optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
thiserror = "1"
tracing = "0.1"
bytes = "1"
regex = "1"
rubato = "0.16"
hound = "3.5"
base64 = "0.22"
parking_lot = "0.12"

[dev-dependencies]
# MockLLMProvider, for framework-backed memory tests without an API key.
ai-agents-llm = "1.0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["test-util"] }
